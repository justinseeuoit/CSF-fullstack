<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animals — FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html">Paddocks</a>
      <a href="animals.html" class="active">Animals</a>
    </nav>
  </header>
  <main>
    <div class="page-header">
      <h2>Animals</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Tag</th>
          <th>Name</th>
          <th>Breed</th>
          <th>Paddock</th>
          <th>Latest Health Event</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="animals-body">
        <tr><td colspan="6" class="loading">Loading…</td></tr>
      </tbody>
    </table>
    <div class="pagination">
      <button id="prev-btn" onclick="changePage(-1)" disabled>Previous</button>
      <span id="page-info">Page 1</span>
      <button id="next-btn" onclick="changePage(1)">Next</button>
    </div>
  </main>
  <script src="app.js"></script>
  <script>
    let currentPage = 0;
    const LIMIT = 5;

    async function loadAnimals() {
      const animals = await api.get(`/animals?page=${currentPage}&limit=${LIMIT}`);
      const tbody = document.getElementById('animals-body');

      tbody.innerHTML = ''; // changed to avoid XSS vulnerability

      if (!animals.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');

        cell.colSpan = 6;
        cell.className = 'empty';
        cell.textContent = 'No animals found.';

        row.appendChild(cell);
        tbody.appendChild(row);

        document.getElementById('next-btn').disabled = true;
        return;
      }

      animals.forEach(a => {
        const row = document.createElement('tr');

        const event = a.latest_health_event
          ? `${a.latest_health_event.event_type} (${a.latest_health_event.date})`
          : '—';

        const values = [
          a.tag_number,
          a.name,
          a.breed ?? '—',
          a.paddock_id ?? '—',
          event
        ];

        values.forEach(value => {
          const td = document.createElement('td');
          td.textContent = value;
          row.appendChild(td);
        });

        const actionTd = document.createElement('td');
        const link = document.createElement('a');

        link.href = `animal-detail.html?id=${encodeURIComponent(a.id)}`;
        link.textContent = 'View';

        actionTd.appendChild(link);
        row.appendChild(actionTd);

        tbody.appendChild(row);
      });

      document.getElementById('page-info').textContent = `Page ${currentPage + 1}`;
      document.getElementById('prev-btn').disabled = currentPage === 0;
      document.getElementById('next-btn').disabled = animals.length < LIMIT;
    }

    function changePage(dir) {
      currentPage = Math.max(0, currentPage + dir);
      loadAnimals();
    }

    loadAnimals();
  </script>
</body>
</html>
