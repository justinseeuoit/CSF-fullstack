<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal — FarmTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FarmTracker</h1>
    <nav>
      <a href="index.html">Paddocks</a>
      <a href="animals.html" class="active">Animals</a>
    </nav>
  </header>
  <main>
    <a href="animals.html" class="back-link">← Back to Animals</a>
    <div id="animal-detail"><p class="loading">Loading…</p></div>

    <section id="health-section" style="display:none">
      <h3>Health Events</h3>
      <table>
        <thead>
          <tr><th>Date</th><th>Type</th><th>Vet</th><th>Notes</th></tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>

      <h4>Log Health Event</h4>
      <form id="event-form">
        <label>Type
          <select name="event_type" required>
            <option value="vaccination">Vaccination</option>
            <option value="checkup">Checkup</option>
            <option value="treatment">Treatment</option>
            <option value="injury">Injury</option>
          </select>
        </label>
        <label>Date <input type="date" name="date" required></label>
        <label>Vet <input type="text" name="vet_name" placeholder="Optional"></label>
        <label>Notes <input type="text" name="notes" placeholder="Optional"></label>
        <button type="submit">Log Event</button>
      </form>
    </section>
    <section id="weight-section" style="display:none">
      <h3>Weight History</h3>

      <p id="latest-weight" class="stat"></p>

      <table>
        <thead>
          <tr><th>Date</th><th>Weight (kg)</th><th>Notes</th></tr>
        </thead>
        <tbody id="weights-body"></tbody>
      </table>

      <h4>Log Weight</h4>
      <form id="weight-form">
        <label>Weight (kg)
          <input type="number" step="0.1" name="weight_kg" required>
        </label>

        <label>Date
          <input type="date" name="date" required>
        </label>

        <label>Notes
          <input type="text" name="notes" placeholder="Optional">
        </label>

        <button type="submit">Add Weight</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const animalId = params.get('id');

    async function load() {
      try {
        const animal = await api.get(`/animals/${animalId}`);

        document.title = `${animal.name} — FarmTracker`;

        const container = document.getElementById('animal-detail');
        container.innerHTML = '';

        const header = document.createElement('div');
        header.className = 'animal-header';

        const h2 = document.createElement('h2');
        h2.textContent = animal.name;

        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = animal.tag_number;

        h2.appendChild(tag);
        header.appendChild(h2);

        const dl = document.createElement('dl');

        const fields = [
          ['Breed', animal.breed ?? '—'],
          ['Date of Birth', animal.date_of_birth ?? '—'],
          ['Paddock', animal.paddock_id ?? 'Unassigned']
        ];

        fields.forEach(([label, value]) => {
          const dt = document.createElement('dt');
          dt.textContent = label;

          const dd = document.createElement('dd');
          dd.textContent = value;

          dl.appendChild(dt);
          dl.appendChild(dd);
        });

        container.appendChild(header);
        container.appendChild(dl);

        document.getElementById('health-section').style.display = 'block';
        document.getElementById('weight-section').style.display = 'block';
      
        await loadEvents();
        await loadWeights();

      } catch (err) {
        // added try catch to handle 404 errors
        const container = document.getElementById('animal-detail');

        container.innerHTML = `
          <div class="error">
            <h2>Animal not found</h2>
            <p>This animal may have been deleted or the link is invalid.</p>
            <a href="animals.html">← Back to Animals</a>
          </div>
        `;

        document.getElementById('health-section').style.display = 'none';
      }
    }

    async function loadEvents() {
      const events = await api.get(`/animals/${animalId}/health-events`);
      const tbody = document.getElementById('events-body');

      tbody.innerHTML = ''; // changed to avoid XSS vulnerability

      if (!events.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');

        cell.colSpan = 4;
        cell.className = 'empty';
        cell.textContent = 'No events recorded.';

        row.appendChild(cell);
        tbody.appendChild(row);

        return;
      }

      events.forEach(e => {
        const row = document.createElement('tr');

        const values = [
          e.date,
          e.event_type,
          e.vet_name ?? '—',
          e.notes ?? '—'
        ];

        values.forEach(value => {
          const td = document.createElement('td');
          td.textContent = value;
          row.appendChild(td);
        });

        tbody.appendChild(row);
      });
    }

    // load weights
    async function loadWeights() {
      const weights = await api.get(`/animals/${animalId}/weights`);
      const tbody = document.getElementById('weights-body');
      const latest = document.getElementById('latest-weight');

      tbody.innerHTML = '';

      if (!weights.length) {
        latest.textContent = 'No weight recorded.';
        return;
      }

      const latestWeight = weights[0];
      latest.textContent = `Latest: ${latestWeight.weight_kg} kg on ${latestWeight.date}`;

      weights.forEach(w => {
        const row = document.createElement('tr');

        [w.date, w.weight_kg, w.notes ?? '—'].forEach(val => {
          const td = document.createElement('td');
          td.textContent = val;
          row.appendChild(td);
        });

        tbody.appendChild(row);
      });
    }

    document.getElementById('event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      await api.post(`/animals/${animalId}/health-events`, data);
      e.target.reset();
      await loadEvents();
    });

    // submit weight form
    document.getElementById('weight-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = Object.fromEntries(new FormData(e.target));

      await api.post(`/animals/${animalId}/weights`, data);

      e.target.reset();
      await loadWeights();
    });

    load();
  </script>
</body>
</html>
